<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{mail/base-layout :: head}"></head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif; line-height: 1.6; color: #333333; background-color: #ffffff;">

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin: 0; padding: 0;">
    <tr>
        <td style="padding: 40px 20px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600"
                   style="max-width: 600px; width: 100%; background-color: #ffffff; border: 1px solid #e0e0e0; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05); border-radius: 8px; overflow: hidden;">

                <tr th:replace="~{mail/base-layout :: colorBar}"></tr>

                <tr>
                    <td style="padding: 40px 30px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">

                            <tr th:replace="~{mail/base-layout :: logoWithGreeting('이메일 인증 코드 안내')}"></tr>

                            <tr>
                                <td style="padding: 30px 0;">
                                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                                           style="background-color: #f8f9fa; border-radius: 6px; border: 1px solid #e9ecef;">
                                        <tr>
                                            <td style="padding: 25px; text-align: center;">
                                                <p style="margin: 8px 0 15px 0; font-size: 14px; color: #555555;">
                                                    인증 코드
                                                </p>
                                                <p style="margin: 8px 0; font-size: 20px; font-weight: 700; color: #333333; letter-spacing: 3px; user-select: all; -webkit-user-select: all; -moz-user-select: all;"
                                                   th:text="${code}">
                                                    123456
                                                </p>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            <tr>
                                <td style="padding-bottom: 30px;">
                                    <p style="margin: 8px 0; font-size: 14px; color: #555555;">
                                        인증코드를 입력하여 계속 인증을 진행해주세요.
                                    </p>
                                </td>
                            </tr>

                            <tr th:replace="~{mail/base-layout :: footer}"></tr>

                        </table>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>

</body>
</html>
