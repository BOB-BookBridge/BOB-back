name: CI

on:
  pull_request:
    branches: [ develop ]

permissions:
  contents: read
  statuses: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy secret yml
        run: |
          echo "${{ secrets.APPLICATION_SECRET }}" > ./src/main/resources/application-secret.yml
          echo "${{ secrets.APPLICATION_PROD }}" > ./src/main/resources/application-prod.yml
          echo "${{ secrets.APPLICATION_DEV }}" > ./src/main/resources/application-dev.yml
        shell: bash

      - name: Setup permission for gradle
        run: chmod +x gradlew

      - name: Build with tests & jacoco report
        run: ./gradlew clean test jacocoTestReport jacocoTestCoverageVerification build --no-daemon

      - name: Upload jacoco reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: |
            build/reports/jacoco/test/html
            build/reports/jacoco/test/jacocoTestReport.xml

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*-SNAPSHOT.jar

  check-coverage:
    name: check-coverage ( >=80% )
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Download JaCoCo reports from build job
        uses: actions/download-artifact@v4
        with:
          name: jacoco
          path: jacoco

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract coverage metrics
        id: coverage
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          
          candidates = [
              "jacoco/build/reports/jacoco/test/jacocoTestReport.xml",
              "build/reports/jacoco/test/jacocoTestReport.xml",
              "jacoco/jacocoTestReport.xml",
              "jacocoTestReport.xml",
          ]
          
          xml_path = None
          for c in candidates:
              if os.path.exists(c):
                  xml_path = c
                  break
          
          if xml_path is None:
              raise FileNotFoundError("jacocoTestReport.xml not found in expected locations")
          
          r = ET.parse(xml_path).getroot()
          
          def g(t):
              c = int(r.find(f"./counter[@type='{t}']").get("covered"))
              m = int(r.find(f"./counter[@type='{t}']").get("missed"))
              return round(c * 100 / (c + m), 2)
          
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"line={g('LINE')}\n")
              f.write(f"branch={g('BRANCH')}\n")
          PY

      - name: Set job summary
        if: always()
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "- Line coverage: ${{ steps.coverage.outputs.line }}%" >> $GITHUB_STEP_SUMMARY
          echo "- Branch coverage: ${{ steps.coverage.outputs.branch }}%" >> $GITHUB_STEP_SUMMARY

      - name: Publish coverage as commit status
        if: always()
        uses: actions/github-script@v7
        env:
          LINE: ${{ steps.coverage.outputs.line }}
          BRANCH: ${{ steps.coverage.outputs.branch }}
        with:
          script: |
            const line = Number(process.env.LINE || 0);
            const branch = Number(process.env.BRANCH || 0);
            const state = (line >= 80 && branch >= 80) ? 'success' : 'failure';
            const sha = context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;
            
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'coverage',
              description: `Line ${line}% | Branch ${branch}%`,
              target_url: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            });

  publish-image:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: .

      - name: Rename to app.jar
        run: mv ./*.jar app.jar

      - name: Docker build & push (latest only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: leehyeonsoo/bserver:latest
      - name: Delete app-jar artifact
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.runId;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id
            });
            const art = data.artifacts.find(a => a.name === 'app-jar');
            if (art) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: art.id
              });
              core.info(`Deleted artifact ${art.name} (${art.id})`);
            }